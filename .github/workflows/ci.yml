name: CI

on:
  push:
    branches: [main]
    tags: ['stackline-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, types, coverage, and package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run verify

  supported-runtime:
    name: Node.js ${{ matrix.node }} production runtime
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [12.22.12, 14.21.3, 16.20.2, 18.20.8, 20.20.0, 22, 24]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@8.19.4
        if: ${{ startsWith(matrix.node, '12.') || startsWith(matrix.node, '14.') || startsWith(matrix.node, '16.') }}
      - run: npm ci --omit=dev --ignore-scripts
      - run: node test/runtime-compat.cjs
      - run: node --test test/windows-path.test.cjs
        if: ${{ runner.os == 'Windows' }}

  webpack:
    name: Webpack 4/5 and current Dart Sass on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run test:webpack
      - run: npm run test:differential

  package:
    name: Packed production artifact
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: mkdir artifact
      - run: npm pack --ignore-scripts --pack-destination artifact
      - run: sha512sum artifact/*.tgz > artifact/SHA512SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: artifact/
          if-no-files-found: error
          retention-days: 14
